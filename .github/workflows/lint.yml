name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A single non-ASCII byte (an em dash in a comment) made DigitalOcean deliver
      # cloud-init.yaml mangled; cloud-init rejected the whole file and applied nothing.
      - name: Infra files are pure ASCII
        run: |
          bad=$(grep -rlP '[^\x00-\x7F]' --include='*.yaml' --include='*.yml' --include='*.sh' --include='Caddyfile' . || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-ASCII characters found (cloud-init user-data must be ASCII):"
            echo "$bad"
            grep -rnP '[^\x00-\x7F]' $bad
            exit 1
          fi

      - name: No CRLF line endings
        run: |
          bad=$(grep -rlI $'\r' --include='*.yaml' --include='*.yml' --include='*.sh' --include='Caddyfile' . || true)
          if [ -n "$bad" ]; then echo "::error::CRLF line endings in: $bad"; exit 1; fi

      - name: cloud-init user-data starts with #cloud-config
        run: head -1 provision/cloud-init.yaml | grep -qx '#cloud-config'

      - name: cloud-init schema validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloud-init
          cloud-init schema --config-file provision/cloud-init.yaml

      # Review 6 Nov 2026: cloud-init installs only the keys embedded in its own
      # users: block (it no longer copies provision/authorized_keys from the clone).
      # The two lists must not drift apart.
      - name: authorized_keys matches cloud-init
        run: |
          diff <(grep -v '^#' provision/authorized_keys | grep -E '^ssh-' | awk '{print $1, $2}' | sort) \
               <(grep -oE 'ssh-(ed25519|rsa|ecdsa[^ ]*) [A-Za-z0-9+/=]+' provision/cloud-init.yaml | sort) \
            || { echo "::error::provision/authorized_keys and cloud-init.yaml ssh_authorized_keys differ"; exit 1; }

      - name: Shell scripts parse
        run: for f in provision/*.sh scripts/*.sh; do bash -n "$f"; done

      # The edge Caddy serves oxytrip.com and panel.oxytrip.com. A Caddyfile typo used to show only on the
      # server, as a site that does not come back after `up prod`. Validate it with the exact Caddy image the
      # compose file pins (read from docker-compose.base.yml, so a version bump is checked on the new one), with
      # placeholder domains for the env the server provides, and prove the check bites: a copy with an
      # unknown directive must be refused.
      - name: Edge Caddyfile validates on the pinned Caddy
        run: |
          img=$(grep -oE 'image: caddy:[^ ]+' compose/docker-compose.base.yml | head -1 | cut -d' ' -f2)
          [ -n "$img" ] || { echo "::error::no caddy image found in compose/docker-compose.base.yml"; exit 1; }
          check() { docker run --rm -e SITE_DOMAIN=example.com -e PANEL_DOMAIN=panel.example.com -e ACME_EMAIL=ops@example.com \
            -v "$1:/etc/caddy/Caddyfile:ro" "$img" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; }
          check "$PWD/caddy/Caddyfile"
          { cat caddy/Caddyfile; printf '\n:9999 {\n\tno_such_directive\n}\n'; } > "$RUNNER_TEMP/Caddyfile.broken"
          if check "$RUNNER_TEMP/Caddyfile.broken"; then
            echo "::error::caddy validate accepted a broken Caddyfile - the check above proves nothing"; exit 1
          fi
