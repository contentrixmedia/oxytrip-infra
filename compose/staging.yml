# Staging overlay - GHCR images pinned by FRONTEND_TAG / PANEL_TAG.
# Moving tag `staging` is what main publishes. This host uses tls internal and
# path-split routing so the same healthcheck as local can run without DNS.
#
#   FRONTEND_TAG=staging PANEL_TAG=staging ./scripts/stack.sh up staging

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    networks:
      - app
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Same as prod.yml (review 6 Nov 2026): a one-shot root chown of the cache volume,
  # then the frontend runs as nextjs (1001:1001) instead of starting as root.
  frontend-cache-perms:
    image: ghcr.io/contentrixmedia/oxytrip-site:${FRONTEND_TAG:?set FRONTEND_TAG}
    pull_policy: missing
    user: "0:0"
    entrypoint: ["chown", "-R", "1001:1001", "/app/.next/cache"]
    restart: "no"
    network_mode: none
    volumes:
      - frontend_next_cache:/app/.next/cache

  frontend:
    image: ghcr.io/contentrixmedia/oxytrip-site:${FRONTEND_TAG:?set FRONTEND_TAG}
    pull_policy: always
    user: "1001:1001"
    volumes:
      - frontend_next_cache:/app/.next/cache
    depends_on:
      frontend-cache-perms:
        condition: service_completed_successfully

  panel:
    image: ghcr.io/contentrixmedia/oxytrip-cms:${PANEL_TAG:?set PANEL_TAG}
    pull_policy: always
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017/oxytrip-cms
    volumes:
      # Keep bot chat history across container replacement (see prod.yml).
      - panel_bot_data:/app/bot/data
    depends_on:
      mongo:
        condition: service_healthy

  edge:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  panel_bot_data:
  caddy_data:
  caddy_config:
  frontend_next_cache:
