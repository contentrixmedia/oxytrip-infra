# Production overlay - GHCR images pinned by SHA (FRONTEND_TAG / PANEL_TAG).
# Do not set those tags to `staging`, `latest`, or `prod`. Promotion is a
# deliberate retag of a git SHA. See README.

services:
  # Review 6 Nov 2026: the frontend used to run as user "0:0" so that the image's
  # entrypoint could chown the cache volume (a named volume hides the image-owned
  # /app/.next/cache, and this one was first filled while the site ran as root) and
  # then drop to nextjs with runuser. That left root inside the serving container.
  # Now this one-shot service, from the same image, does the chown as root and
  # exits; the frontend itself starts as nextjs (uid/gid 1001:1001 in the site's
  # Dockerfile.server), and its entrypoint skips the root-only branch. Idempotent,
  # so it is safe against the existing server volume on every `up`.
  frontend-cache-perms:
    image: ghcr.io/contentrixmedia/oxytrip-site:${FRONTEND_TAG:?set FRONTEND_TAG to a git SHA}
    pull_policy: missing
    user: "0:0"
    entrypoint: ["chown", "-R", "1001:1001", "/app/.next/cache"]
    restart: "no"
    network_mode: none
    volumes:
      - frontend_next_cache:/app/.next/cache

  frontend:
    image: ghcr.io/contentrixmedia/oxytrip-site:${FRONTEND_TAG:?set FRONTEND_TAG to a git SHA}
    pull_policy: always
    user: "1001:1001"
    volumes:
      - frontend_next_cache:/app/.next/cache
    depends_on:
      frontend-cache-perms:
        condition: service_completed_successfully

  panel:
    image: ghcr.io/contentrixmedia/oxytrip-cms:${PANEL_TAG:?set PANEL_TAG to a git SHA}
    pull_policy: always
    environment:
      PORT: "8080"
      NODE_ENV: production
    volumes:
      # Bot conversations live in a SQLite file at DB_PATH unless TURSO_* is set,
      # and it is not. Without this volume, replacing the container wipes chat
      # history - which is what happens on Render today.
      - panel_bot_data:/app/bot/data

  edge:
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  frontend_next_cache:
  panel_bot_data:
